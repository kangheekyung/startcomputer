<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴퓨터 주변기기 자모음 더블클릭 탐험대</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2f3640;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(116, 125, 140, 0.25);
            width: 100%;
            max-width: 950px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 4px solid #dfe6e9;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #f1f2f6;
            padding: 20px 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            gap: 20px;
            border: 2px solid #dfe4ea;
        }

        .left-game-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }

        .instruction-text {
            font-size: 18px;
            color: #57606f;
        }

        .target-word-area {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .target-slot {
            width: 85px;
            height: 85px;
            border: 4px dashed #ff6b81;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #ff6b81;
            background-color: #fff0f3;
            transition: all 0.3s ease;
        }

        .target-slot.filled {
            border: 4px solid #ff4757;
            background-color: #ff4757;
            color: #ffffff;
            transform: scale(1.05);
        }

        .target-display-box {
            background-color: #ffffff;
            border: 3px solid #ff7979;
            border-radius: 20px;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.15);
            white-space: nowrap;
        }

        .target-label {
            font-size: 14px;
            color: #ff6b81;
            margin-bottom: 5px;
        }

        .target-word-big {
            font-size: 42px;
            color: #2f3640;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 25px;
            align-items: center;
        }

        .level-badge {
            background: #ff6b81;
            color: white;
            padding: 10px 22px;
            border-radius: 18px;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.3);
        }

        .cheer-box {
            font-size: 18px;
            color: #e056fd;
            background: #f8f9fa;
            padding: 10px 22px;
            border-radius: 18px;
            border: 2px solid #f3e8ff;
        }

        .pool-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            padding: 25px;
            background: #f1f2f6;
            border-radius: 20px;
            min-height: 160px;
            align-items: center;
            border: 2px solid #dfe4ea;
        }

        .jamo-card {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #2f3640;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            transition: transform 0.1s, background-color 0.2s;
            border: 2px solid #f1f2f6;
        }

        .jamo-card:hover {
            background-color: #ffeaa7;
            transform: translateY(-5px);
            border-color: #fdcb6e;
        }

        .jamo-card:active {
            transform: scale(0.95);
        }

        .jamo-card.used {
            opacity: 0.25;
            pointer-events: none;
            background-color: #dfe4ea;
            color: #a4b0be;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 25px;
        }

        .btn {
            background-color: #a29bfe;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 20px;
            font-family: 'Jua', sans-serif;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(162, 155, 254, 0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover:not(:disabled) {
            background-color: #6c5ce7;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background-color: #dfe4ea;
            color: #b2bec3;
            cursor: not-allowed;
            box-shadow: none;
        }

        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            z-index: 10;
            display: none;
        }

        .success-overlay h2 {
            font-size: 50px;
            color: #ff6b81;
            margin-bottom: 15px;
        }

        .success-overlay p {
            font-size: 24px;
            color: #57606f;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="info-bar">
        <div class="level-badge" id="levelIndicator">단계 1 / 5</div>
        <div class="cheer-box" id="cheerBox">💡 자음과 모음을 정확하게 순서대로 두 번(더블클릭) 눌러봐요!</div>
    </div>

    <div class="top-section">
        <div class="left-game-area">
            <div class="instruction-text" id="instructionText">아래의 자모음을 순서대로 더블클릭하여 글자를 조합해 보세요!</div>
            <div class="target-word-area" id="targetWordArea"></div>
        </div>
        <div class="target-display-box">
            <div class="target-label">✨ 오늘의 주변기기 ✨</div>
            <div class="target-word-big" id="targetWordBig">
                <span id="targetEmoji">🖥️</span>
                <span id="targetText">모니터</span>
            </div>
        </div>
    </div>

    <div class="pool-area" id="poolArea"></div>

    <div class="nav-controls">
        <button class="btn" onclick="changeLevel(-1)">⬅️ 이전 단계</button>
        <button class="btn" id="nextBtn" onclick="handleNextOrReset()" disabled>다음 단계로 ➡️</button>
    </div>

    <div class="success-overlay" id="successOverlay">
        <h2>🎉 딩동댕! 정답입니다! 🎉</h2>
        <p id="successMessage">멋지게 단어를 완성했어요!</p>
        <button class="btn" id="overlayBtn" onclick="nextStageFromOverlay()">다음 단계로 가기 🚀</button>
    </div>
</div>

<script>
    const CHO_ARR = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    const JUNG_ARR = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
    const JONG_ARR = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

    const COMPLEX_JUNG_MAP = {
        "ㅗㅏ": "ㅘ",
        "ㅗㅐ": "ㅙ",
        "ㅗㅣ": "ㅚ",
        "ㅜㅓ": "ㅝ",
        "ㅜㅔ": "ㅞ",
        "ㅜㅣ": "ㅟ",
        "ㅡㅣ": "ㅢ"
    };

    function makeHangulChar(cho, jung, jong = "") {
        const choIdx = CHO_ARR.indexOf(cho);
        const jungIdx = JUNG_ARR.indexOf(jung);
        const jongIdx = JONG_ARR.indexOf(jong);

        if (choIdx === -1 || jungIdx === -1) return null;

        const unicode = 0xAC00 + (choIdx * 21 + jungIdx) * 28 + jongIdx;
        return String.fromCharCode(unicode);
    }

    const levels = [
        {
            word: "모니터",
            emoji: "🖥️",
            syllables: [
                { cho: "ㅁ", jung1: "ㅗ", jung2: "", jong: "" },
                { cho: "ㄴ", jung1: "ㅣ", jung2: "", jong: "" },
                { cho: "ㅌ", jung1: "ㅓ", jung2: "", jong: "" }
            ]
        },
        {
            word: "본체",
            emoji: "📦",
            syllables: [
                { cho: "ㅂ", jung1: "ㅗ", jung2: "", jong: "ㄴ" },
                { cho: "ㅊ", jung1: "ㅔ", jung2: "", jong: "" }
            ]
        },
        {
            word: "마우스",
            emoji: "🖱️",
            syllables: [
                { cho: "ㅁ", jung1: "ㅏ", jung2: "", jong: "" },
                { cho: "ㅇ", jung1: "ㅜ", jung2: "", jong: "" },
                { cho: "ㅅ", jung1: "ㅡ", jung2: "", jong: "" }
            ]
        },
        {
            word: "키보드",
            emoji: "⌨️",
            syllables: [
                { cho: "ㅋ", jung1: "ㅣ", jung2: "", jong: "" },
                { cho: "ㅂ", jung1: "ㅗ", jung2: "", jong: "" },
                { cho: "ㄷ", jung1: "ㅡ", jung2: "", jong: "" }
            ]
        },
        {
            word: "컴퓨터",
            emoji: "💻",
            syllables: [
                { cho: "ㅋ", jung1: "ㅓ", jung2: "", jong: "ㅁ" },
                { cho: "ㅍ", jung1: "ㅠ", jung2: "", jong: "" },
                { cho: "ㅌ", jung1: "ㅓ", jung2: "", jong: "" }
            ]
        }
    ];

    let currentLevel = 0;
    let currentSyllables = [];
    let currentSylIndex = 0;
    let currentStep = 0;
    
    let tempCho = "";
    let tempJung1 = "";
    let tempJung2 = "";
    let tempJong = "";

    const cheers = [
        "✨ 반짝반짝! 더블클릭으로 컴퓨터 주변기기를 완성해봐요!",
        "🚀 자음과 모음을 차근차근 순서대로 톡톡 눌러봐요!",
        "💡 복합모음은 두 개의 모음을 차례대로 누르면 합쳐져요!",
        "⭐ 집중해서 멋지게 단어를 완성해 봅시다!"
    ];

    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } else if (type === 'clear') {
                [523, 587, 659, 698, 783].forEach((f, idx) => {
                    setTimeout(() => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.2, ctx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                        o.start(); o.stop(ctx.currentTime + 0.3);
                    }, idx * 100);
                });
            }
        } catch (e) {}
    }

    function initLevel() {
        const data = levels[currentLevel];
        currentSyllables = data.syllables;
        currentSylIndex = 0;
        currentStep = 0;
        tempCho = "";
        tempJung1 = "";
        tempJung2 = "";
        tempJong = "";

        document.getElementById('levelIndicator').innerText = `단계 ${currentLevel + 1} / 5`;
        document.getElementById('targetEmoji').innerText = data.emoji;
        document.getElementById('targetText').innerText = data.word;
        document.getElementById('cheerBox').innerText = cheers[Math.floor(Math.random() * cheers.length)];

        const targetArea = document.getElementById('targetWordArea');
        targetArea.innerHTML = '';
        currentSyllables.forEach((_, idx) => {
            const slot = document.createElement('div');
            slot.className = 'target-slot';
            slot.id = `slot-${idx}`;
            slot.innerText = '_';
            targetArea.appendChild(slot);
        });

        setupPoolCards();
        
        // 버튼 텍스트 및 상태 업데이트
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = true;
        if (currentLevel === levels.length - 1) {
            nextBtn.innerText = "처음으로 🔄";
        } else {
            nextBtn.innerText = "다음 단계로 ➡️";
        }

        document.getElementById('successOverlay').style.display = 'none';
    }

    function setupPoolCards() {
        let allJamos = [];
        currentSyllables.forEach(syl => {
            if (syl.cho) allJamos.push(syl.cho);
            if (syl.jung1) allJamos.push(syl.jung1);
            if (syl.jung2) allJamos.push(syl.jung2);
            if (syl.jong) allJamos.push(syl.jong);
        });

        let shuffled = allJamos
            .map(v => ({ v, sort: Math.random() }))
            .sort((a, b) => a.sort - b.sort)
            .map(item => item.v);

        const poolArea = document.getElementById('poolArea');
        poolArea.innerHTML = '';

        shuffled.forEach((jamo) => {
            const card = document.createElement('div');
            card.className = 'jamo-card';
            card.innerText = jamo;

            let lastClick = 0;
            card.addEventListener('click', () => {
                let now = new Date().getTime();
                if (now - lastClick < 400 && now - lastClick > 0) {
                    handleDoubleClick(card, jamo);
                }
                lastClick = now;
            });
            card.addEventListener('dblclick', () => {
                handleDoubleClick(card, jamo);
            });

            poolArea.appendChild(card);
        });
    }

    function handleDoubleClick(card, jamo) {
        if (card.classList.contains('used')) return;

        const targetSyl = currentSyllables[currentSylIndex];
        let expectedJamo = "";

        if (currentStep === 0) {
            expectedJamo = targetSyl.cho;
        } else if (currentStep === 1) {
            expectedJamo = targetSyl.jung1;
        } else if (currentStep === 2) {
            expectedJamo = targetSyl.jung2;
        } else if (currentStep === 3) {
            expectedJamo = targetSyl.jong;
        }

        if (jamo === expectedJamo) {
            playSound('correct');
            card.classList.add('used');

            if (currentStep === 0) {
                tempCho = jamo;
                currentStep = 1;
                document.getElementById(`slot-${currentSylIndex}`).innerText = tempCho;
            } else if (currentStep === 1) {
                tempJung1 = jamo;
                if (targetSyl.jung2 && targetSyl.jung2 !== "") {
                    currentStep = 2;
                    let combined = makeHangulChar(tempCho, tempJung1, "");
                    if (combined) document.getElementById(`slot-${currentSylIndex}`).innerText = combined;
                } else {
                    let combined = makeHangulChar(tempCho, tempJung1, "");
                    document.getElementById(`slot-${currentSylIndex}`).innerText = combined;

                    if (!targetSyl.jong || targetSyl.jong === "") {
                        finalizeSyllable();
                    } else {
                        currentStep = 3;
                    }
                }
            } else if (currentStep === 2) {
                tempJung2 = jamo;
                let actualJung = COMPLEX_JUNG_MAP[tempJung1 + tempJung2] || tempJung2;
                let combined = makeHangulChar(tempCho, actualJung, "");
                document.getElementById(`slot-${currentSylIndex}`).innerText = combined;

                if (!targetSyl.jong || targetSyl.jong === "") {
                    finalizeSyllable();
                } else {
                    tempJung1 = actualJung;
                    currentStep = 3;
                }
            } else if (currentStep === 3) {
                tempJong = jamo;
                let finalJung = (targetSyl.jung2 && targetSyl.jung2 !== "") ? (COMPLEX_JUNG_MAP[targetSyl.jung1 + targetSyl.jung2] || targetSyl.jung1) : targetSyl.jung1;
                
                let combined = makeHangulChar(tempCho, finalJung, tempJong);
                document.getElementById(`slot-${currentSylIndex}`).innerText = combined;
                finalizeSyllable();
            }

        } else {
            card.style.backgroundColor = '#ff6b81';
            card.style.color = '#ffffff';
            setTimeout(() => {
                card.style.backgroundColor = '#ffffff';
                card.style.color = '#2f3640';
            }, 300);
        }
    }

    function finalizeSyllable() {
        const slot = document.getElementById(`slot-${currentSylIndex}`);
        slot.classList.add('filled');

        currentSylIndex++;
        currentStep = 0;
        tempCho = "";
        tempJung1 = "";
        tempJung2 = "";
        tempJong = "";

        if (currentSylIndex >= currentSyllables.length) {
            stageClear();
        }
    }

    function stageClear() {
        playSound('clear');
        const isLastStage = (currentLevel === levels.length - 1);
        
        document.getElementById('successMessage').innerText = `"${levels[currentLevel].word}" 단어를 완벽하게 완성했어요!`;
        
        const overlayBtn = document.getElementById('overlayBtn');
        if (isLastStage) {
            overlayBtn.innerText = "처음으로 가기 🔄";
        } else {
            overlayBtn.innerText = "다음 단계로 가기 🚀";
        }

        document.getElementById('successOverlay').style.display = 'flex';
        document.getElementById('nextBtn').disabled = false;
    }

    function handleNextOrReset() {
        if (currentLevel < levels.length - 1) {
            currentLevel++;
            initLevel();
        } else {
            // 마지막 단계 완료 후 '처음으로' 버튼 클릭 시 1단계로 이동
            currentLevel = 0;
            initLevel();
        }
    }

    function nextStageFromOverlay() {
        document.getElementById('successOverlay').style.display = 'none';
        if (currentLevel < levels.length - 1) {
            currentLevel++;
            initLevel();
        } else {
            currentLevel = 0;
            initLevel();
        }
    }

    function changeLevel(dir) {
        currentLevel += dir;
        if (currentLevel < 0) currentLevel = 0;
        if (currentLevel >= levels.length) currentLevel = levels.length - 1;
        initLevel();
    }

    window.onload = initLevel;
</script>

</body>
</html>
