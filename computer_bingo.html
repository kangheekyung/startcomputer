<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>컴퓨터 빙고 게임</title>

  <style>

    *{
      box-sizing:border-box;
      user-select:none;
    }

    body{
      margin:0;
      font-family:"Arial Rounded MT Bold","맑은 고딕",sans-serif;
      background:linear-gradient(to bottom,#dff6ff,#ffffff);
      overflow-x:hidden;
    }

    h1{
      text-align:center;
      color:#ff6b6b;
      margin-top:10px;
      margin-bottom:10px;
      font-size:42px;
    }

    .top-bar{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:15px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }

    button{
      font-size:22px;
      padding:12px 25px;
      border:none;
      border-radius:20px;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
    }

    .reset-btn{
      background:#ffd43b;
    }

    .reset-btn:hover{
      background:#fcc419;
    }

    .exit-btn{
      background:#ff8787;
      color:white;
    }

    .exit-btn:hover{
      background:#fa5252;
    }

    .bingo-count{
      background:white;
      border-radius:20px;
      padding:12px 22px;
      font-size:28px;
      font-weight:bold;
      color:#ff006e;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
      min-width:180px;
      text-align:center;
    }

    .container{
      display:flex;
      gap:20px;
      padding:20px;
      justify-content:center;
      align-items:flex-start;
      flex-wrap:wrap;
    }

    /* 왼쪽 단어 영역 */

    .word-area{
      width:470px;
      background:white;
      border-radius:25px;
      padding:20px;
      box-shadow:0 6px 15px rgba(0,0,0,0.15);
    }

    .word-title{
      text-align:center;
      font-size:32px;
      color:#4dabf7;
      margin-bottom:15px;
    }

    .word-list{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .word-card{
      background:#fff3bf;
      border-radius:20px;
      padding:12px;
      text-align:center;
      font-size:24px;
      cursor:grab;
      border:4px solid #ffe066;
      transition:0.2s;
    }

    .word-card:hover{
      transform:scale(1.05);
    }

    .emoji{
      display:block;
      font-size:42px;
      margin-bottom:5px;
    }

    /* 빙고판 */

    .bingo-area{
      position:relative;
      width:540px;
      height:540px;
      background:white;
      border-radius:30px;
      padding:10px;
      box-shadow:0 6px 15px rgba(0,0,0,0.15);
    }

    .bingo-grid{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      gap:10px;
      position:relative;
      z-index:2;
    }

    .cell{
      background:#e7f5ff;
      border-radius:20px;
      border:4px dashed #74c0fc;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:30px;
      font-weight:bold;
      color:#1864ab;
      position:relative;
      overflow:hidden;
    }

    .cell.filled{
      border-style:solid;
      background:#d0ebff;
    }

    .circle{
      position:absolute;
      width:80%;
      height:80%;
      border:8px solid red;
      border-radius:50%;
      pointer-events:none;
    }

    svg{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:5;
    }

    @media (max-width:1100px){

      .container{
        flex-direction:column;
        align-items:center;
      }

    }

  </style>
</head>

<body>

  <h1>🖥️ 컴퓨터 빙고 게임 🖱️</h1>

  <div class="top-bar">

    <button class="reset-btn" onclick="resetGame()">
      🔄 다시하기
    </button>

    <button class="exit-btn" onclick="exitGame()">
      ❌ 종료
    </button>

    <div class="bingo-count" id="bingoText">
      🎉 빙고 0개
    </div>

  </div>

  <div class="container">

    <!-- 왼쪽 단어 카드 -->

    <div class="word-area">

      <div class="word-title">
        단어를 끌어다 놓아요!
      </div>

      <div class="word-list">

        <div class="word-card" draggable="true" data-word="모니터">
          <span class="emoji">🖥️</span>모니터
        </div>

        <div class="word-card" draggable="true" data-word="키보드">
          <span class="emoji">⌨️</span>키보드
        </div>

        <div class="word-card" draggable="true" data-word="마우스">
          <span class="emoji">🖱️</span>마우스
        </div>

        <div class="word-card" draggable="true" data-word="헤드셋">
          <span class="emoji">🎧</span>헤드셋
        </div>

        <div class="word-card" draggable="true" data-word="프린터">
          <span class="emoji">🖨️</span>프린터
        </div>

        <div class="word-card" draggable="true" data-word="노트북">
          <span class="emoji">💻</span>노트북
        </div>

        <div class="word-card" draggable="true" data-word="스피커">
          <span class="emoji">🔊</span>스피커
        </div>

        <div class="word-card" draggable="true" data-word="USB">
          <span class="emoji">💾</span>USB
        </div>

        <div class="word-card" draggable="true" data-word="카메라">
          <span class="emoji">📷</span>카메라
        </div>

        <div class="word-card" draggable="true" data-word="인터넷">
          <span class="emoji">🌐</span>인터넷
        </div>

        <div class="word-card" draggable="true" data-word="마이크">
          <span class="emoji">🎤</span>마이크
        </div>

        <div class="word-card" draggable="true" data-word="와이파이">
          <span class="emoji">📶</span>와이파이
        </div>

        <div class="word-card" draggable="true" data-word="태블릿">
          <span class="emoji">📱</span>태블릿
        </div>

        <div class="word-card" draggable="true" data-word="메모리">
          <span class="emoji">💽</span>메모리
        </div>

        <div class="word-card" draggable="true" data-word="로봇">
          <span class="emoji">🤖</span>로봇
        </div>

      </div>

    </div>

    <!-- 빙고판 -->

    <div class="bingo-area">

      <svg id="lineSvg"></svg>

      <div class="bingo-grid">

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

      </div>

    </div>

  </div>

  <script>

    const cards = document.querySelectorAll('.word-card');
    const cells = document.querySelectorAll('.cell');
    const svg = document.getElementById('lineSvg');
    const bingoText = document.getElementById('bingoText');

    let draggedWord = null;
    let draggedCard = null;

    // 빙고 색상 순서
    const lineColors = [
      "#ff0000", // 빨강
      "#228be6", // 파랑
      "#9c36ff", // 보라
      "#37b24d", // 초록
      "#ff922b", // 주황
      "#f06595", // 분홍
      "#12b886", // 민트
      "#7950f2"
    ];

    // 이미 그린 빙고 저장
    let savedBingos = [];

    // 드래그 시작

    cards.forEach(card=>{

      card.addEventListener('dragstart',()=>{

        draggedWord = card.dataset.word;
        draggedCard = card;

      });

    });

    // 빙고칸 기능

    cells.forEach(cell=>{

      // 드래그 허용

      cell.addEventListener('dragover',(e)=>{

        e.preventDefault();

      });

      // 드롭

      cell.addEventListener('drop',(e)=>{

        e.preventDefault();

        if(cell.textContent.trim()===''){

          cell.textContent = draggedWord;
          cell.classList.add('filled');

          draggedCard.style.visibility='hidden';

        }

      });

      // 클릭 시 동그라미

      cell.addEventListener('click',()=>{

        if(cell.textContent.trim()==='') return;

        const oldCircle = cell.querySelector('.circle');

        if(oldCircle){

          oldCircle.remove();

        }else{

          const circle = document.createElement('div');
          circle.classList.add('circle');

          cell.appendChild(circle);

        }

        checkBingo();

      });

    });

    // 빙고 검사

    function checkBingo(){

      svg.innerHTML = '';

      const checked = [...cells].map(cell=>
        cell.querySelector('.circle') ? 1 : 0
      );

      const bingoLines = [

        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]

      ];

      let currentBingos = [];

      // 현재 빙고 찾기

      bingoLines.forEach(line=>{

        const isBingo = line.every(i=>checked[i]);

        if(isBingo){

          currentBingos.push(line);

        }

      });

      // 새 빙고만 추가 저장

      currentBingos.forEach(line=>{

        const alreadyExists = savedBingos.some(saved=>
          JSON.stringify(saved.line) === JSON.stringify(line)
        );

        if(!alreadyExists){

          savedBingos.push({
            line: line,
            color: lineColors[savedBingos.length % lineColors.length]
          });

        }

      });

      // 없어진 빙고 제거

      savedBingos = savedBingos.filter(saved=>

        currentBingos.some(line=>
          JSON.stringify(saved.line) === JSON.stringify(line)
        )

      );

      // 저장된 빙고 다시 그리기

      savedBingos.forEach(saved=>{

        drawLine(saved.line, saved.color);

      });

      bingoText.textContent =
        `🎉 빙고 ${savedBingos.length}개`;

    }

    // 빙고 줄 그리기

    function drawLine(line,color){

      const startCell = cells[line[0]];
      const endCell = cells[line[2]];

      const rect1 = startCell.getBoundingClientRect();
      const rect2 = endCell.getBoundingClientRect();
      const parentRect = svg.getBoundingClientRect();

      const x1 =
        rect1.left + rect1.width/2 - parentRect.left;

      const y1 =
        rect1.top + rect1.height/2 - parentRect.top;

      const x2 =
        rect2.left + rect2.width/2 - parentRect.left;

      const y2 =
        rect2.top + rect2.height/2 - parentRect.top;

      const lineEl = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

      lineEl.setAttribute("x1",x1);
      lineEl.setAttribute("y1",y1);
      lineEl.setAttribute("x2",x2);
      lineEl.setAttribute("y2",y2);

      lineEl.setAttribute("stroke",color);
      lineEl.setAttribute("stroke-width","12");
      lineEl.setAttribute("stroke-linecap","round");

      svg.appendChild(lineEl);

    }

    // 다시하기

    function resetGame(){

      cells.forEach(cell=>{

        cell.textContent='';
        cell.classList.remove('filled');

      });

      document.querySelectorAll('.circle')
        .forEach(c=>c.remove());

      cards.forEach(card=>{

        card.style.visibility='visible';

      });

      svg.innerHTML='';

      savedBingos = [];

      bingoText.textContent='🎉 빙고 0개';

    }

    // 종료

    function exitGame(){

      const answer =
        confirm("게임을 종료할까요?");

      if(answer){

        window.close();

        setTimeout(()=>{

          alert(
            "창 닫기가 안 되면 탭을 직접 닫아주세요 😊"
          );

        },300);

      }

    }

  </script>

</body>
</html>
